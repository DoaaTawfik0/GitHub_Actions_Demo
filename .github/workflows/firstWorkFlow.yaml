name: first workflow

on:
  push:
    branches:
      - "main"

jobs:
  first-workflow-job:
    name: "first Job"
    runs-on: ubuntu-latest

    steps:
      - name: run before checkout
        run: ls
        shell: bash

      - name: run checkout action
        uses: actions/checkout@v3

      - name: run after checkout
        run: ls
        shell: bash